name: CI

on:
    pull_request:
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    checks:
        name: Lint / typecheck / unit
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm typecheck
            - run: pnpm test:unit

    e2e:
        name: E2E (Windows)
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
              with:
                  version: 10
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            # Electron 45 has no install hook of its own and pnpm never runs the root postinstall on an
            # update, so fetch the binary with the same script the dev/dist scripts use.
            - run: node scripts/fix-electron-path.mjs
            - run: pnpm exec electron --version
            - run: pnpm test:e2e
              env:
                  GITCANO_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
            - name: Upload E2E artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-artifacts
                  path: ${{ github.workspace }}/e2e-artifacts
                  if-no-files-found: ignore
